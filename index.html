<div id="toast" class="toast hidden"></div>

    <script>
    // Kill stale service workers / caches that keep broken app.js
    (function () {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        });
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { caches.delete(k); });
        });
      }
    })();
  </script>
  <script src="js/data.js?v=5"></script>
  <script src="js/modules/ui.js?v=5"></script>
  <script src="js/modules/combat.js?v=5"></script>

  <script src="js/modules/story.js?v=5"></script>
  <script src="js/factions-extra.js?v=5"></script>
  <script src="js/app.v5.js"></script>

  <script>
    // Failsafe: never leave user on loading screen (works even if app.js fails)
    function __forceShowApp() {
      try {
        var ls = document.getElementById('loading-screen');
        var app = document.getElementById('app');
        if (ls) {
          ls.classList.add('hidden');
          ls.classList.add('fade-out');
          ls.style.display = 'none';
          ls.style.opacity = '0';
          ls.style.visibility = 'hidden';
          ls.style.pointerEvents = 'none';
          ls.style.zIndex = '-1';
        }
        if (app) {
          app.classList.remove('hidden');
          app.style.display = 'flex';
          app.style.visibility = 'visible';
          app.style.opacity = '1';
        }
      } catch (e) {}
    }
    __forceShowApp();
    setTimeout(__forceShowApp, 600);
    setTimeout(__forceShowApp, 1500);
    setTimeout(__forceShowApp, 3000);
    window.addEventListener('load', function () {
      __forceShowApp();
      setTimeout(__forceShowApp, 500);
    });
    document.addEventListener('DOMContentLoaded', function () {
      setTimeout(__forceShowApp, 300);
    });
  </script>

</body>
</html>
